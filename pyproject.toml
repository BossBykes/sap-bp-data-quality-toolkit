[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-bp-dq"
version = "0.1.0"
description = "SAP Business Partner Data Quality Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rapidfuzz>=3.0",
    "openpyxl>=3.1",
]

[project.scripts]
sap-bp-dq = "sap_bp_dq.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
